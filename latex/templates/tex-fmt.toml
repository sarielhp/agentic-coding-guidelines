# Match the paper's four-space environment indentation while leaving
# top-level document commands flush left.
tabsize = 4
tabchar = "space"
no-indent-envs = ["document"]

# Wrap long lines at 72 columns. tex-fmt only splits overlong lines; it
# never joins lines, so the paper's hand-chosen paragraph and display
# breaks are preserved, including separate label and math delimiter
# lines. Run latex_fix_layout first; tex-fmt indents those lines after
# they are present in the source.
wrap = true
wraplen = 72
wrapmin = 72
